<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אתגר הקוד ב-#C</title>
    <link href="utils/CSS/tailwind.css" rel="stylesheet" />
    <!-- Load React and ReactDOM before the JSX components that depend on them. -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Transpile the browser-loaded JSX scripts without a separate build step. -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Fira+Code&display=swap');

        body {
            font-family: 'Assistant', sans-serif;
            background-color: #f1f5f9;
        }

        .code-font {
            font-family: 'Fira Code', monospace;
            direction: ltr;
            text-align: left;
        }

        .ltr-content {
            direction: ltr;
            text-align: left;
        }
    </style>
    <!-- <link href="CSS/security.css" rel="stylesheet" />-->
    <link href="utils/CSS/security.css" rel="stylesheet" />
</head>
<body>
    <div id="root"></div>

    <!-- 1. Security & Protection Script -->
    <!--<script src="utils/security.js"></script>-->

    <!-- Load shared configuration and utilities before components use them. -->
    <script src="config.js"></script>
    <script src="topics-config.js"></script>
    <script src="utils/utils.js"></script>
    <script src="utils/auth.js"></script>

    <!-- Register the question bank before mounting the application. -->
    <script src="content/Input_Output_Variables/questions.js"></script>
    <script src="content/Operators/questions.js"></script>

    <!-- Define each screen component before loading the application controller. -->
    <script type="text/babel" src="screens/Welcome.js"></script>
    <script type="text/babel" src="screens/Topics.js"></script>
    <script type="text/babel" src="screens/TeacherPanel.js"></script>
    <script type="text/babel" src="screens/Quiz.js"></script>
    <script type="text/babel" src="screens/Summary.js"></script>

    <!-- Load the controller last so all globally registered components are available. -->
    <script type="text/babel" src="App.js"></script>
</body>
</html>
