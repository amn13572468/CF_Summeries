    <!--צור קובץ HTML אחד עצמאי (Single Page Application) של "חדר בריחה לימודי" (Escape Room) בנושא יסודות C#: משתנים, קלט (Console.ReadLine) ופלט (Console.WriteLine/Write, שרשור, Interpolation).

    הקוד צריך להתבסס על המבנה, העיצוב (תמת סייבר/האקרים כהה) והטכנולוגיות של קובץ ה-HTML הקיים (Tailwind CSS, React 18, Babel, Google Apps Script integration).

    ---

    ### 🎯 דרישות הציוד והספריות:
    - HTML5 בודד עם CDN של Tailwind CSS, React 18, ReactDOM 18, Babel, ו-html2pdf.js.
    - פונטים: 'Assistant', 'Fira Code' (לקוד C#), ו-'Orbitron' (לתצוגת סייבר).
    - כיווניות: RTL לממשק בעברית, LTR לקטעי הקוד ב-C# והאפשרויות.

    ---

    ### 🧠 מבנה השאלות והתוכן (סה"כ 45 שאלות):
    הגדר מערך JavaScript בשם `questions` שיכיל בדיוק 45 שאלות בלעדיות ומגוונות, המחולקות ל-3 רמות קושי (15 שאלות בכל רמה):

    1. **רמה קלה (Easy - 15 שאלות):**
    - הגדרת משתנים מטיפוסים בסיסיים (`int`, `double`, `string`, `bool`, `char`).
    - פלט בסיסי עם `Console.WriteLine` ו-`Console.Write`.
    - קריאת מחרוזת בסיסית מ-`Console.ReadLine()`.
    - הצבת ערכים והדפסת משתנים.

    2. **רמה בינונית (Medium - 15 שאלות):**
    - המרת טיפוסים מפורשת ומשתמעת (`int.Parse`, `Convert.ToInt32`, casting).
    - שרשור מחרוזות (+) מול String Interpolation (`$"{var}"`).
    - חלוקת שלמים (Integer Division) ושארית (`%`).
    - אופרטורים של קידום והפחתה (`++`, `--`) לפני/אחרי המשתנה.
    - קלט מספרי ושילובו בחישובים.

    3. **רמה קשה (Hard - 15 שאלות):**
    - סדר קדימויות באופרטורים ותופעות לוואי (side effects) בתוך הדפסה.
    - גלישת ערכים (Overflow), המרות בין `double` ל-`int` ואיבוד דיוק.
    - פורמטים של פלט (כגון `:F2` או מחרוזות מוברחות `\n`, `\t`, `\"`).
    - עבודה עם תוים (אריתמטיקה של `char` והמרה ל-`int`).
    - קטעי קוד מורכבים עם מספר משתנים, שינוי ערכים עוקב ומעקב אחר פלט (Trace).

    כל אובייקט שאלה במערך חייב להיות במבנה הבא:
    {
    id: 1,
    level: "easy", // "easy", "medium", "hard"
    question: "טקסט השאלה בעברית",
    code: "קטע קוד ב-C#",
    options: ["אופציה 1", "אופציה 2", "אופציה 3", "אופציה 4"],
    answer: 0, // אינדקס התשובה הנכונה (0-3)
    explanation: "הסבר מפורט בעברית מדוע זו התשובה הנכונה"
    }

    ---

    ### 🖥️ ממשק המשתמש והזרימה (UI/UX Flow):

    1. **מסך פתיחה (Welcome Screen):**
    - כותרת מרשימה: "חדר בריחה: מעבדת המשתנים, הקלט והפלט ב-#C".
    - בחירת רמת קושי על ידי המשתמש:
    - קל (15 שאלות)
    - בינוני (15 שאלות)
    - קשה (15 שאלות)
    - מרתון מלא (כל 45 השאלות ברצף)
    - כפתור "התחל פענוח" (START DECRYPTION).

    2. **מסך שאלות (Quiz Screen):**
    - בר התקדמות (Progress Bar) בהתאם לכמות השאלות במסלול שנבחר.
    - חיווי דרגת הקושי והשכבה (LAYER X/Y).
    - תיבת קוד מעוצבת בעיצוב מסוף האקרים (Terminal/Cyber) עם כיוון LTR ופונט Fira Code.
    - 4 אופציות לבחירה.
    - כפתור "פצח תשובה" (DECRYPT ANSWER) שבודק את התשובה.
    - לאחר הבדיקה: הצגת משוב צבעוני (ירוק לשיגור מצליח / אדום לשגיאה) בצרוף ההסבר המפורט.
    - כפתור למעבר לשאלה הבאה / לסיום.

    3. **מסך סיכום ודוח ביצועים (Summary Screen):**
    - ציון סופי באחוזים.
    - טופס הזנת פרטי תלמיד (שם פרטי, שם משפחה, בחירת מורה מפקח).
    - טבלת פירוט תשובות (עבר/נכשל לכל שאלה).
    - כפתור "שגר נתונים למערכת" (UPLOAD TO MAINFRAME) השולח את הנתונים ל-Google Apps Script (fetch בשיטת POST עם mode: 'no-cors').
    - כפתור "אתחול סימולציה" (REBOOT SIMULATION) לחזרה למסך הראשי.

    ---
